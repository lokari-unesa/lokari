# ================================================================
# MODE PRODUCTION / BUILD
#   docker compose -f docker-compose.yaml up -d --build
#
# MODE DEVELOPMENT (default, hot reload) => lihat docker-compose.override.yaml
#   docker compose up -d          # override dimuat otomatis oleh compose
# ================================================================
services:
  backend:
    container_name: lokari-backend
    restart: on-failure
    build:
      context: ./backend
      dockerfile: docker/Dockerfile-backend
      # target default = stage final (prod): binary statis alpine
    ports:
      - "${BACKEND_PORT:-5181}:${BACKEND_PORT:-5181}"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Di dalam docker, DB diakses via service "db" pada port 5432 (port listen
      # PostgreSQL di dalam container SELALU 5432; POSTGRES_PORT hanya port publish host,
      # jangan dipakai di sini).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-lokari_pg_dev_local}@db:5432/${POSTGRES_DB:-lokari_db}?sslmode=disable
    networks:
      - lokari-network

  db:
    container_name: lokari-db
    build:
      context: ./backend/docker
      dockerfile: Dockerfile-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Default di bawah HANYA untuk dev lokal. Di compose produksi ini port DB
      # sudah tidak di-expose ke host, tapi untuk deploy sungguhan WAJIB set
      # POSTGRES_PASSWORD dengan nilai kuat (mis. lewat `.env` root proyek).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lokari_pg_dev_local}
      POSTGRES_DB: ${POSTGRES_DB:-lokari_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lokari_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - lokari_pgdata:/var/lib/postgresql/data
    networks:
      - lokari-network

volumes:
  lokari_pgdata:
    driver: local

networks:
  lokari-network:
    driver: bridge
