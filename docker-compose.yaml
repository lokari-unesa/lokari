# ================================================================
# MODE PRODUCTION / BUILD
#   docker compose -f docker-compose.yaml up -d --build
#
# MODE DEVELOPMENT (default, hot reload) => lihat docker-compose.override.yaml
#   docker compose up -d          # override dimuat otomatis oleh compose
# ================================================================
services:
  frontend:
    container_name: lokari-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # target default = stage final (prod): server adapter-node
    ports:
      - "${FRONTEND_PORT:-5180}:${FRONTEND_PORT:-5180}"
    depends_on:
      - backend
    environment:
      VITE_PORT: ${FRONTEND_PORT:-5180}
      BACKEND_URL: http://backend:${BACKEND_PORT:-5181}
    networks:
      - lokari-network

  backend:
    container_name: lokari-backend
    restart: on-failure
    build:
      context: ./backend
      dockerfile: docker/Dockerfile-backend
      # target default = stage final (prod): binary statis alpine
    ports:
      - "${BACKEND_PORT:-5181}:${BACKEND_PORT:-5181}"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      # Di dalam docker, DB diakses via service "db" pada port 5432 (port listen
      # PostgreSQL di dalam container SELALU 5432; POSTGRES_PORT hanya port publish host,
      # jangan dipakai di sini).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-lokari_db}?sslmode=disable
    networks:
      - lokari-network

  db:
    container_name: lokari-db
    build:
      context: ./backend/docker
      dockerfile: Dockerfile-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-lokari_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432" # host:container — container tetap 5432; host 5433 agar konsisten dengan backend/.env (go run manual)
    volumes:
      - lokari_pgdata:/var/lib/postgresql/data
    networks:
      - lokari-network

volumes:
  lokari_pgdata:
    driver: local

networks:
  lokari-network:
    driver: bridge