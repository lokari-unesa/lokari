version: '3.8'

services:
  db:
    build: 
      context: ./docker
    container_name: lokari_db_vector
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=lokari_db
    ports:
      - "5433:5432" # Map ke port 5433 agar tidak bentrok dengan Postgres lokal
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
