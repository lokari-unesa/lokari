# ================================================================
# MODE DEVELOPMENT — dimuat OTOMATIS oleh `docker compose up` (default).
# Hot reload: backend via air, frontend via vite dev server + bind mount.
#
# Untuk mode production: docker compose -f docker-compose.yaml up -d --build
# ================================================================
services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app

  frontend:
    container_name: lokari-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # target default = stage final (prod): server adapter-node
    ports:
      - "${FRONTEND_PORT:-5180}:${FRONTEND_PORT:-5180}"
    depends_on:
      - backend
    environment:
      VITE_PORT: ${FRONTEND_PORT:-5180}
      BACKEND_URL: http://backend:${BACKEND_PORT:-5181}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - lokari-network

  db:
    # Publikasi port DB HANYA untuk development lokal (via override ini).
    # Di compose produksi (docker-compose.yaml) port DB sengaja tidak dibuka ke
    # host — akses hanya lewat jaringan internal "lokari-network".
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  adminer:
    container_name: lokari-db-adminer
    # Web UI ringan untuk melihat/menjelajah database (dev only).
    # Buka http://localhost:8080 → pilih "PostgreSQL":
    #   server=db, user=postgres, password=sama dengan POSTGRES_PASSWORD di .env root
    image: adminer:4.8.1
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - lokari-network
